const Reveal = ({ children, delay = 0, className = '' }) => {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);

  useEffect(() => {
    // Mark the mount node so the .reveal fade styles only ever apply when the
    // app is actually hydrated — otherwise JS failure would hide all content.
    document.getElementById('root')?.classList.add('js-reveal');
  }, []);

  useEffect(() => {
    const el = ref.current;
    if (!el || typeof IntersectionObserver === 'undefined') { setShown(true); return; }

    // Failsafe: never leave a section invisible. If the observer has not fired
    // (hidden tab, unusual scroll container, capture tooling), reveal it anyway.
    const failsafe = setTimeout(() => setShown(true), 1000);
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.unobserve(e.target); } }),
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    io.observe(el);
    return () => { clearTimeout(failsafe); io.disconnect(); };
  }, []);
  return (
    <div ref={ref} className={`reveal ${shown ? 'is-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
};

const BMI_BANDS = [
  { max: 18.5, label: 'Underweight', color: '#38bdf8', text: 'text-sky-400', bar: 'from-sky-500 to-sky-400', advice: 'You need a calorie surplus plus progressive strength training. Our trainers can build you a sustainable mass-gain plan.' },
  { max: 25, label: 'Normal', color: '#10b981', text: 'text-emerald-400', bar: 'from-emerald-500 to-emerald-400', advice: 'Great range to build from. Now focus on strength, muscle tone and consistency — that is where the transformation happens.' },
  { max: 30, label: 'Overweight', color: '#f59e0b', text: 'text-amber-400', bar: 'from-amber-500 to-amber-400', advice: 'A structured mix of resistance training and cardio will move you fast. We will map a realistic weekly plan for you.' },
  { max: Infinity, label: 'Obese', color: '#ef4444', text: 'text-red-400', bar: 'from-red-500 to-red-400', advice: 'Start low-impact and build gradually — our trainers will design a supervised plan that protects your joints while you progress.' }
];
const bandFor = (bmi) => BMI_BANDS.find((b) => bmi < b.max) || BMI_BANDS[BMI_BANDS.length - 1];

function BmiCalculator() {
  const [height, setHeight] = useState(175);
  const [weight, setWeight] = useState(72);

  const bmi = useMemo(() => {
    const h = Number(height) / 100;
    const w = Number(weight);
    if (!h || !w || h <= 0 || w <= 0) return null;
    const v = w / (h * h);
    return Number.isFinite(v) ? v : null;
  }, [height, weight]);

  const rounded = bmi ? Math.round(bmi * 10) / 10 : null;
  const band = bmi ? bandFor(bmi) : null;
  const position = bmi ? Math.min(100, Math.max(0, ((bmi - 14) / (40 - 14)) * 100)) : 0;

  const fields = [
    { key: 'height', label: 'Height', unit: 'cm', min: 120, max: 220, value: height, set: setHeight, icon: 'TrendingUp' },
    { key: 'weight', label: 'Weight', unit: 'kg', min: 35, max: 180, value: weight, set: setWeight, icon: 'Activity' }
  ];

  return (
    <section id="bmi" style={{ animation: 'fadeIn .6s ease both' }} className="relative border-y border-white/5 bg-zinc-950 py-20 sm:py-28">
      <div className="absolute inset-0 bg-[radial-gradient(90%_60%_at_80%_0%,rgba(245,158,11,.09),transparent_60%)]" />
      <div className="relative mx-auto max-w-7xl px-5 sm:px-8">
        <Reveal>
          <SectionHeading
            center
            eyebrow="Know Your Starting Point"
            title="Quick"
            accent="BMI Calculator"
            blurb="Enter your height and weight for an instant reading, then let a certified trainer turn the number into an actual plan."
          />
        </Reveal>

        <Reveal delay={80}>
          <div className="mx-auto mt-14 grid max-w-5xl gap-6 lg:grid-cols-2">
            {/* Inputs */}
            <div className="rounded-3xl border border-white/10 bg-zinc-900/50 p-6 backdrop-blur sm:p-8">
              <div className="flex items-center gap-3">
                <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-500/15 text-amber-500">
                  <Icon name="Calculator" className="h-5 w-5" />
                </span>
                <h3 className="display-tight text-2xl font-extrabold text-white">Your Measurements</h3>
              </div>

              <div className="mt-7 space-y-8">
                {fields.map((f) => (
                  <div key={f.key}>
                    <div className="flex items-end justify-between gap-3">
                      <label htmlFor={`bmi-${f.key}`} className="flex items-center gap-2 text-sm font-semibold uppercase tracking-[0.14em] text-zinc-400">
                        <Icon name={f.icon} className="h-4 w-4 text-amber-500" />
                        {f.label}
                      </label>
                      <div className="flex items-baseline gap-1.5">
                        <input
                          id={`bmi-${f.key}`}
                          type="number"
                          inputMode="decimal"
                          min={f.min}
                          max={f.max}
                          value={f.value}
                          onChange={(e) => f.set(e.target.value === '' ? '' : Math.max(0, Math.min(400, Number(e.target.value))))}
                          className="w-20 rounded-lg border border-zinc-700 bg-zinc-950 px-2.5 py-1.5 text-right text-lg font-bold text-amber-400 outline-none transition-colors focus:border-amber-500"
                        />
                        <span className="text-sm font-medium text-zinc-500">{f.unit}</span>
                      </div>
                    </div>
                    <input
                      type="range"
                      aria-label={`${f.label} slider`}
                      min={f.min}
                      max={f.max}
                      value={Number(f.value) || f.min}
                      onChange={(e) => f.set(Number(e.target.value))}
                      className="mt-3.5 w-full cursor-pointer"
                    />
                    <div className="mt-1 flex justify-between text-[0.68rem] font-medium text-zinc-600">
                      <span>{f.min} {f.unit}</span>
                      <span>{f.max} {f.unit}</span>
                    </div>
                  </div>
                ))}
              </div>

              <p className="mt-7 flex gap-2.5 rounded-2xl border border-white/5 bg-zinc-950/70 p-3.5 text-xs leading-relaxed text-zinc-500">
                <Icon name="ShieldCheck" className="mt-0.5 h-4 w-4 shrink-0 text-emerald-500" />
                BMI is a general screening tool and does not account for muscle mass, age or body composition.
              </p>
            </div>

            {/* Result */}
            <div className="relative overflow-hidden rounded-3xl border border-amber-500/25 bg-gradient-to-b from-zinc-900/80 to-zinc-950 p-6 sm:p-8">
              <div className="absolute -right-16 -top-16 h-48 w-48 rounded-full blur-3xl transition-colors duration-700" style={{ backgroundColor: band ? `${band.color}33` : '#f59e0b22' }} />
              <div className="relative">
                <div className="flex items-center justify-between">
                  <h3 className="display-tight text-2xl font-extrabold text-white">Your Result</h3>
                  <span className="rounded-full border border-white/10 bg-zinc-950/70 px-3 py-1 text-[0.68rem] font-bold uppercase tracking-[0.18em] text-zinc-400">
                    Live
                  </span>
                </div>

                <div className="mt-8 flex items-end gap-4">
                  <span className={`display-tight text-7xl font-extrabold transition-colors duration-500 sm:text-8xl ${band ? band.text : 'text-zinc-600'}`}>
                    {rounded !== null ? rounded.toFixed(1) : '--'}
                  </span>
                  <div className="pb-3">
                    <p className="text-xs font-semibold uppercase tracking-[0.18em] text-zinc-500">BMI Score</p>
                    <p className={`display-tight mt-1 text-2xl font-extrabold ${band ? band.text : 'text-zinc-600'}`}>
                      {band ? band.label : 'Awaiting input'}
                    </p>
                  </div>
                </div>

                {/* Scale */}
                <div className="mt-8">
                  <div className="relative h-2.5 w-full overflow-hidden rounded-full bg-zinc-800">
                    <div className="absolute inset-y-0 left-0 flex w-full">
                      <span className="h-full w-[17.3%] bg-sky-500/70" />
                      <span className="h-full w-[25%] bg-emerald-500/70" />
                      <span className="h-full w-[19.2%] bg-amber-500/70" />
                      <span className="h-full flex-1 bg-red-500/70" />
                    </div>
                  </div>
                  <div className="relative h-0">
                    <span
                      className="absolute -top-[1.35rem] z-10 flex h-6 w-6 -translate-x-1/2 items-center justify-center rounded-full border-[3px] border-zinc-950 shadow-lg transition-all duration-500 ease-out"
                      style={{ left: `${position}%`, backgroundColor: band ? band.color : '#52525b' }}
                      aria-hidden="true"
                    />
                  </div>
                  <div className="mt-3 flex justify-between text-[0.68rem] font-semibold uppercase tracking-wider text-zinc-600">
                    <span>Under 18.5</span>
                    <span>18.5–25</span>
                    <span>25–30</span>
                    <span>30+</span>
                  </div>
                </div>

                <p className="mt-7 min-h-[3.5rem] text-sm leading-relaxed text-zinc-400">
                  {band ? band.advice : 'Move the sliders to see your result instantly.'}
                </p>

                <div className="mt-7 border-t border-white/5 pt-6">
                  <Btn href={WA_TRAINER} target="_blank" rel="noopener noreferrer" variant="whatsapp" className="w-full">
                    <Icon name="MessageCircle" className="h-5 w-5" />

                </div>
              </div>
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ *
 *  Floating WhatsApp button
 * ------------------------------------------------------------------ */
function FloatingWhatsApp() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setVisible(true), 700);
    return () => clearTimeout(t);
  }, []);

  return (
    <a
      href={WA_FREE_TRIAL}
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Chat with Model Town Gym on WhatsApp"
      className={`group fixed bottom-5 right-5 z-50 flex items-center gap-3 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 py-3.5 pl-4 pr-4 text-white shadow-[0_16px_40px_-12px_rgba(16,185,129,.85)] transition-all duration-500 hover:scale-[1.04] sm:bottom-7 sm:right-7 ${
        visible ? 'translate-y-0 opacity-100' : 'pointer-events-none translate-y-6 opacity-0'
      }`}
    >
      <span className="absolute inset-0 -z-10 animate-pulse-ring rounded-full bg-emerald-500/40" aria-hidden="true" />
      <span className="relative flex h-7 w-7 items-center justify-center">
        <Icon name="MessageCircle" className="h-7 w-7" strokeWidth={2.2} />
      </span>
      <span className="max-w-0 overflow-hidden whitespace-nowrap text-sm font-bold opacity-0 transition-all duration-500 group-hover:max-w-[11rem] group-hover:opacity-100">
        Quick Chat
      </span>
    </a>
  );
}

/* ------------------------------------------------------------------ *
 *  Utilities + App
 * ------------------------------------------------------------------ */
function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - 72;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function LandingRoot() {
  return (
    <React.Fragment>
      <Header />
      <main>
        <Hero />
        <BmiCalculator />
        <Pricing />
        <Facilities />
        <Timing />
      </main>
      <LocationFooter />
      <FloatingWhatsApp />
    </React.Fragment>
  );
}

const rootEl = document.getElementById('root');
if (window.ReactDOM && window.ReactDOM.createRoot) {
  window.ReactDOM.createRoot(rootEl).render(<LandingRoot />);
} else {
  window.ReactDOM.render(<LandingRoot />, rootEl);
}
</script>
